<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PixelOwl · Free Tracking Scanner{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ─── PixelOwl palette (matches the main app) ─── */
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --panel-2: #1e293b;
    --line: #334155;
    --line-soft: #1e293b;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --muted: #94a3b8;
    --brand: #6366f1;
    --brand-2: #4f46e5;
    --brand-soft: rgba(99, 102, 241, 0.12);
    --good: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
    --chip: #1e293b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(99, 102, 241, 0.18) 0%, transparent 55%),
      radial-gradient(600px 400px at 10% 10%, rgba(79, 70, 229, 0.10) 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }

  a {
    color: #a5b4fc;
    text-decoration: none;
    transition: color 160ms ease;
  }
  a:hover { color: #c7d2fe; }

  /* ─── Top navigation bar ─── */
  .pw-nav {
    position: sticky;
    top: 0;
    z-index: 40;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: rgba(2, 6, 23, 0.72);
    border-bottom: 1px solid var(--line-soft);
  }
  .pw-nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .pw-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
  }
  .pw-mark {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
    box-shadow: 0 6px 18px -6px rgba(99, 102, 241, 0.6);
  }
  .pw-name {
    font-weight: 700;
    font-size: 15.5px;
    letter-spacing: -0.01em;
  }
  .pw-nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pw-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: 12px;
    color: var(--text-2);
  }
  .pw-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--good);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
  }
  .pw-cta-link {
    padding: 8px 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    transition: filter 160ms ease, transform 160ms ease;
  }
  .pw-cta-link:hover {
    color: #fff;
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  /* ─── Main content wrapper ─── */
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ─── Legacy class aliases kept so the existing report.html continues to render ─── */
  .top {
    display: none; /* replaced by the sticky nav above */
  }

  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #0b1120 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    margin: 18px 0;
    box-shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.6);
  }

  h1 {
    font-size: 34px;
    letter-spacing: -0.025em;
    margin: 20px 0 8px;
    font-weight: 700;
  }
  h2 {
    font-size: 20px;
    letter-spacing: -0.015em;
    margin: 0 0 16px;
    font-weight: 600;
  }
  .muted { color: var(--muted); }

  /* ─── Buttons & inputs ─── */
  .btn {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
    color: #fff;
    border: 0;
    padding: 13px 22px;
    border-radius: 11px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14.5px;
    letter-spacing: -0.005em;
    transition: filter 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.6);
  }
  .btn:hover:not(:disabled) {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }
  .btn:disabled { opacity: 0.6; cursor: progress; }

  input[type=url], input[type=text] {
    flex: 1;
    min-width: 0;
    background: #0b1120;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 14px 15px;
    border-radius: 11px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }
  input[type=url]:focus, input[type=text]:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
  }

  /* ─── Error banner ─── */
  .err {
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fecaca;
    padding: 12px 15px;
    border-radius: 11px;
    margin-top: 16px;
    font-size: 13.5px;
  }

  /* ─── Tables (used by the report) ─── */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 12px 13px;
    border-bottom: 1px solid var(--line-soft);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  tr:last-child td { border-bottom: 0; }

  /* ─── Pills (status badges) ─── */
  .pill {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .pill.good { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
  .pill.warn { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
  .pill.bad  { background: rgba(239, 68, 68, 0.15);  color: #fca5a5; }
  .pill.muted { background: var(--chip); color: var(--muted); }

  /* ─── Footer ─── */
  .footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }
  .footer a { color: var(--muted); }
  .footer a:hover { color: var(--text-2); }

  /* ─── Scan loader overlay ─── */
  .spinner { display: none; }
  form.loading .spinner { display: inline-block; }
  @keyframes pw-spin { to { transform: rotate(360deg); } }

  #loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    place-items: center;
    background: rgba(2, 6, 23, 0.84);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #loader.show {
    display: grid;
    animation: pw-fade 300ms ease;
  }
  @keyframes pw-fade { from { opacity: 0; } to { opacity: 1; } }

  .loader-card {
    text-align: center;
    max-width: 460px;
    padding: 36px 30px;
  }
  .ring {
    width: 76px;
    height: 76px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 5px solid rgba(99, 102, 241, 0.14);
    border-top-color: var(--brand);
    animation: pw-spin 1s linear infinite;
  }
  .loader-domain {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
    word-break: break-all;
    letter-spacing: -0.01em;
  }
  #loaderMsg {
    color: var(--muted);
    font-size: 14px;
    min-height: 22px;
    transition: opacity 250ms ease;
  }
  .bar {
    margin: 22px auto 0;
    height: 6px;
    width: 260px;
    max-width: 80%;
    border-radius: 999px;
    background: var(--line-soft);
    overflow: hidden;
    position: relative;
  }
  .bar::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--brand), var(--brand-2));
    animation: pw-slide 1.4s ease-in-out infinite;
  }
  @keyframes pw-slide {
    0%   { left: -40%; }
    100% { left: 100%; }
  }
  .loader-hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 18px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 28px 18px 60px; }
    h1 { font-size: 28px; }
    .pw-nav-inner { padding: 12px 18px; }
    .pw-chip { display: none; }
  }
</style>
</head>
<body>
  <!-- ── PixelOwl top nav ────────────────────────────────────── -->
  <nav class="pw-nav">
    <div class="pw-nav-inner">
      <a href="{{ pixelowl_home_url or 'https://truetag-b3hr.onrender.com' }}" class="pw-brand" aria-label="PixelOwl home">
        <span class="pw-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3C7 3 4 6.5 4 11v3a7 7 0 0 0 14 0v-3c0-4.5-3-8-6-8Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="9" cy="11" r="1.6" fill="#fff"/>
            <circle cx="15" cy="11" r="1.6" fill="#fff"/>
            <path d="M11 15h2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="pw-name">PixelOwl</span>
      </a>
      <div class="pw-nav-right">
        <span class="pw-chip"><span class="dot"></span>Free scanner · no signup</span>
        <a href="{{ pixelowl_home_url or 'https://truetag-b3hr.onrender.com' }}/signup" class="pw-cta-link">Start monitoring free</a>
      </div>
    </div>
  </nav>

  <div class="wrap">
    {% block body %}{% endblock %}

    <div class="footer">
      Free tracking audit by <a href="{{ pixelowl_home_url or 'https://truetag-b3hr.onrender.com' }}">PixelOwl</a> ·
      scans public pages only · results are heuristic.
    </div>
  </div>
</body>
</html>
